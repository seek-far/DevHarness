apiVersion: v2
name: sdlcma
description: |
  SDLCMA local k8s deployment (Stage 1a.4). Helm-packaged equivalent of the
  raw manifests under infra/kind/manifests/: Redis + Gateway + Orchestrator,
  the three ConfigMaps, and the orchestrator Job-manager RBAC. The
  `sdlcma-secrets` Secret is intentionally NOT part of this chart — it is
  created out of band (kubectl create secret) and only referenced by name,
  preserving the 1a.2/1a.3 "no real credentials in the repo" stance.
type: application
# Chart version — bump on chart structure changes.
# 0.2.0: 1a.6 added NetworkPolicy, Ingress, Prometheus scrape annotations,
# and an opt-in eval Indexed Job. The version bump is also what makes the
# Terraform helm_release (1a.5) detect the change and upgrade in place.
version: 0.2.0
# Tracks the app/stage this chart targets.
appVersion: "1a.6"

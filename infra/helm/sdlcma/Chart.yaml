apiVersion: v2
name: sdlcma
description: |
  SDLCMA local k8s deployment (Stage 1a.4). Helm-packaged equivalent of the
  raw manifests under infra/kind/manifests/: Redis + Gateway + Orchestrator,
  the three ConfigMaps, and the orchestrator Job-manager RBAC. The
  `sdlcma-secrets` Secret is intentionally NOT part of this chart — it is
  created out of band (kubectl create secret) and only referenced by name,
  preserving the 1a.2/1a.3 "no real credentials in the repo" stance.
type: application
# Chart version — bump on chart structure changes.
# 0.2.0: 1a.6 added NetworkPolicy, Ingress, Prometheus scrape annotations,
# and an opt-in eval Indexed Job. The version bump is also what makes the
# Terraform helm_release (1a.5) detect the change and upgrade in place.
# 0.3.0: 2026-05-30 — LLM gateway + runrecord exporter + kube-prometheus-stack
# dependency for the "production rehearsal on ls4900" stance. All toggles
# default OFF; AWS ECS is unaffected (different deployment surface).
version: 0.3.0
# Tracks the app/stage this chart targets.
appVersion: "1a.7"

# ── dependencies ────────────────────────────────────────────────────────────
# kube-prometheus-stack is the de facto standard K8s observability stack
# (Operator + Prometheus + Grafana + Alertmanager + node-exporter + KSM).
# Conditional on monitoring.enabled — when false (default) the dependency
# is skipped entirely, so an `helm install` against a chart that hasn't
# run `helm dep update` still works for the lean case.
#
# Pinned to ~58.x (currently the latest LTS-shaped release line). Set the
# upper bound to the next major to surface breaking changes via dep-update.
dependencies:
  - name: kube-prometheus-stack
    version: "~58.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled

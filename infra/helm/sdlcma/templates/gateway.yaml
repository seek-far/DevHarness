apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: gateway
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: gateway
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
      name: http

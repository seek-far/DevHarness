apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: gateway
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        # Rolls the pod whenever any ConfigMap data changes — without this,
        # `helm upgrade -f new-values.yaml` quietly leaves pods running the
        # OLD config (helm only restarts pods when the Deployment template
        # itself changes). Cost = an extra rollout when ConfigMaps churn.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.observability.prometheusAnnotations }}
        # 1a.6 observability hook. The gateway has no real /metrics endpoint
        # yet (would be a code change: prometheus_client + a route); we point
        # scrape at /healthz so a Prometheus that IS deployed gets an up/down
        # signal today, and the contract is in place for a future /metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gateway.service.port | quote }}
        prometheus.io/path: {{ .Values.observability.scrapePath | quote }}
        {{- end }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: gateway
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
      name: http

{{- /*
1a.6 NetworkPolicy — closes the gap flagged back in 1a.1 ("namespace is not
a security boundary; NetworkPolicy comes in 1a.6").

Scope decision: restrict INGRESS only, leave EGRESS open.
A blanket default-deny egress in kind also blocks DNS (CoreDNS in
kube-system) and every outbound the workers legitimately need (LLM API,
GitLab, image pulls). Doing egress correctly means enumerating those with
DNS + ipBlock rules — deferred (documented in NOTES §6e). Ingress lockdown
is the high-value, low-risk half and is what we ship here.

POD-SCOPE decision (incident 2026-05-31): the deny policy selects ONLY the
first-party core app pods it was written for —
  app=gateway / app=orchestrator / app=redis / app=bf-worker
(worker Job pods get app=bf-worker from K8sJobSpawner._build_job). It must
NOT use an empty podSelector (namespace-wide deny): the observability stack
added later (kube-prometheus-stack grafana/prometheus/kube-state-metrics/
node-exporter — pods we don't own and don't label) plus llm-gateway /
runrecord-exporter would be silently blackholed. A namespace-wide deny here
broke the grafana ingress (504), the grafana→Prometheus datasource, every
/metrics scrape, AND worker→llm-gateway (LLM_VIA_GATEWAY). Pods outside this
selector fall back to the k8s default (allow ingress). Kept enforceable by
tests/test_helm_chart.py. NEVER widen the podSelector back to {}.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-core-app-ingress
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  # Scoped to the first-party core app pods (NOT empty = NOT namespace-wide —
  # see header). The allow-* policies below are additive (OR-combined).
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["gateway", "orchestrator", "redis", "bf-worker"]
  policyTypes:
    - Ingress
  # No ingress rules → deny all inbound to the selected pods.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: gateway
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    # Webhook traffic — reaches the gateway via ingress-nginx (a different
    # namespace) or kubectl port-forward. Empty `from` = any source. This
    # port also carries the gateway's /metrics surface (scraped by Prometheus).
    - ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-app
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: redis
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["gateway", "orchestrator", "bf-worker"]
      ports:
        - protocol: TCP
          port: 6379
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-metrics
  namespace: {{ include "sdlcma.namespace" . }}
  labels:
    app: orchestrator
    {{- include "sdlcma.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes:
    - Ingress
  ingress:
    # Prometheus (kube-prometheus-stack) scrapes the orchestrator's headless
    # orchestrator-metrics Service. The orchestrator is in the deny set above
    # (it takes no other inbound), so without this the scrape is blackholed
    # and orchestrator panels stay empty. Non-sensitive counters → allow from
    # any source (mirrors allow-gateway-ingress) rather than coupling to the
    # kube-prometheus-stack Prometheus pod labels.
    - ports:
        - protocol: TCP
          port: {{ .Values.monitoring.orchestratorMetricsPort | default 9102 }}
{{- end }}
{{- end }}

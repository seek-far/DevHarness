{{- /*
Three independent ConfigMaps (gateway / orchestrator / worker), one per
service, so each rolls independently and the blast radius stays small —
same rationale as the raw configmap.yaml. data: is rendered from
.Values.configMaps.<svc> (UPPERCASE env-var keys).

When .Values.llmGateway.enabled is true, the worker ConfigMap is seeded
with LLM_VIA_GATEWAY=true + LLM_API_BASE_URL pointing at the in-cluster
llm-gateway Service — automatically routing every worker pod through the
cache. User-supplied values in .Values.configMaps.worker still win
(mergeOverwrite is right-biased), so an explicit `LLM_VIA_GATEWAY: "false"`
in the overlay opts out without disabling the gateway itself.
*/ -}}
{{- range $svc := list "gateway" "orchestrator" "worker" }}
{{- $data := dict }}
{{- if and (eq $svc "worker") $.Values.llmGateway.enabled }}
{{-   $_ := set $data "LLM_VIA_GATEWAY" "true" }}
{{-   $_ := set $data "LLM_API_BASE_URL" (printf "http://llm-gateway:%v/v1" $.Values.llmGateway.service.port) }}
{{- end }}
{{- /* Orchestrator-side: derive the K8sJobSpawner inputs from the same
       single source of truth the chart-rendered Pods consume
       (.Values.extraHostAliases, .Values.journal.persistence). This way
       setup.sh only has to inject extraHostAliases via --set; the chart
       fans it out to (a) gateway/orchestrator/llm-gw/exporter PodSpecs
       and (b) every spawned bf-worker Job (via this env var). One
       source of truth for "kind pods reach `minus` via the host's
       tailscale interface." */}}
{{- if eq $svc "orchestrator" }}
{{-   if gt (len $.Values.extraHostAliases) 0 }}
{{-     $_ := set $data "K8S_HOST_ALIASES" ($.Values.extraHostAliases | toJson) }}
{{-   end }}
{{-   if $.Values.journal.persistence.enabled }}
{{-     $_ := set $data "K8S_JOURNAL_HOST_PATH" $.Values.journal.persistence.hostPath }}
{{-   end }}
{{- /* Worker Job shaping (plan item W4). Every key is written ONLY when the
       corresponding value is non-empty, so a chart rendered with the stock
       values.yaml carries none of them and K8sJobSpawner falls back to its
       default-empty settings — i.e. the pre-W4 Job spec. */}}
{{-   with $.Values.workerJob }}
{{-     with .resources.requests.cpu }}{{ $_ := set $data "K8S_WORKER_CPU_REQUEST" . }}{{ end }}
{{-     with .resources.requests.memory }}{{ $_ := set $data "K8S_WORKER_MEM_REQUEST" . }}{{ end }}
{{-     with .resources.requests.ephemeralStorage }}{{ $_ := set $data "K8S_WORKER_EPHEMERAL_STORAGE_REQUEST" . }}{{ end }}
{{-     with .resources.limits.cpu }}{{ $_ := set $data "K8S_WORKER_CPU_LIMIT" . }}{{ end }}
{{-     with .resources.limits.memory }}{{ $_ := set $data "K8S_WORKER_MEM_LIMIT" . }}{{ end }}
{{-     with .dockerSocket }}{{ $_ := set $data "K8S_WORKER_DOCKER_SOCK" . }}{{ end }}
{{-     with .stepCheckpoint.hostPath }}{{ $_ := set $data "K8S_WORKER_STEP_CHECKPOINT_HOST_PATH" . }}{{ end }}
{{-     if gt (len .nodeSelector) 0 }}{{ $_ := set $data "K8S_WORKER_NODE_SELECTOR" (.nodeSelector | toJson) }}{{ end }}
{{-     if gt (len .tolerations) 0 }}{{ $_ := set $data "K8S_WORKER_TOLERATIONS" (.tolerations | toJson) }}{{ end }}
{{- /*   resumeAffinity has a non-empty default ("preferred") on the settings
         side, so writing it always would be a no-op key in every ConfigMap.
         Only surface a deliberate deviation. */}}
{{-     if and .resumeAffinity (ne .resumeAffinity "preferred") }}
{{-       $_ := set $data "K8S_WORKER_RESUME_AFFINITY" .resumeAffinity }}
{{-     end }}
{{-   end }}
{{- end }}
{{- $_ := mergeOverwrite $data (index $.Values.configMaps $svc) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svc }}-config
  namespace: {{ include "sdlcma.namespace" $ }}
  labels:
    app: {{ $svc }}
    {{- include "sdlcma.labels" $ | nindent 4 }}
data:
  {{- toYaml $data | nindent 2 }}
---
{{- end }}

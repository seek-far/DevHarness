# SDLCMA Helm values (Stage 1a.4).
#
# Defaults reproduce the raw kind manifests 1:1 so `helm install` is a drop-in
# for `kubectl apply -f infra/kind/manifests/`. Override per-environment via
# `-f my-values.yaml` or `--set`.

namespace:
  name: sdlcma
  # When true the chart renders a Namespace object (parity with redis.yaml,
  # which used to be what created the ns). Set false if you manage the ns
  # out of band / via `helm install --create-namespace`.
  create: true

# Default image pull policy. IfNotPresent because images are `kind load`-ed,
# not pulled from a registry (same trap documented since 1a.1).
imagePullPolicy: IfNotPresent

# Pod-level hostAliases injected into every SDLCMA pod (gateway, orchestrator,
# llm-gateway, runrecord-exporter) and into per-bug worker Jobs (via the
# K8sJobSpawner — see orchestrator/spawner.py). Standard K8s hostAliases
# shape: [{ip, hostnames: [...]}]. Default empty list = zero rendered output
# (byte-identical to no-hostAliases-at-all).
#
# Use case: self-hosted GitLab reachable on the operator's tailnet (e.g.
# "minus" at a tailscale IP that isn't in cluster DNS). setup.sh detects the
# tailscale IP at deploy time via `tailscale ip -4 <host>` and injects it via
# --set; in-chart authors should leave this empty.
#
# Outside K8s (AWS ECS / docker / standalone) this field is irrelevant —
# different deployment surfaces, different network shapes.
extraHostAliases: []
#   - ip: 100.x.x.x
#     hostnames:
#       - minus

# The out-of-band Secret. The chart only references it by name in envFrom;
# it is NEVER templated (no real credentials in the repo / in Helm values).
#   kubectl create secret generic sdlcma-secrets -n sdlcma \
#     --from-literal=LLM_API_KEY=... --from-literal=GITLAB_PRIVATE_TOKEN=... \
#     --from-file=SSH_PRIVATE_KEY=$HOME/.ssh/id_ed25519
secret:
  name: sdlcma-secrets

# ── ConfigMap data ────────────────────────────────────────────────
# Rendered verbatim into the three ConfigMaps. Keys are UPPERCASE env-var
# names (envFrom turns each into a process env var; Pydantic reads them at
# higher priority than the image-baked *_local_k8s.env). Edit here, then
# `helm upgrade` + rollout-restart the affected Deployment.
configMaps:
  gateway:
    ENV: local_k8s
    USE_REDIS: "True"
    REDIS_URL: redis://redis:6379/0
    GATEWAY_STREAM: gateway:stream
  orchestrator:
    ENV: local_k8s
    REDIS_URL: redis://redis:6379/0
    GATEWAY_STREAM: gateway:stream
    GATEWAY_CONSUMER_GROUP: orchestrator-group
    GATEWAY_CONSUMER_NAME: orchestrator-0
    WORKER_HEARTBEAT_INTERVAL: "10"
    WORKER_HEARTBEAT_TTL: "30"
    HEALTH_CHECK_INTERVAL: "20"
    STREAM_BLOCK_MS: "1000"
    STREAM_COUNT: "20"
    WORKER_IMAGE: dh-bf-worker:latest
  worker:
    ENV: local_k8s
    REDIS_URL: redis://redis:6379/0
    WORKER_HEARTBEAT_INTERVAL: "10"
    WORKER_HEARTBEAT_TTL: "30"
    STREAM_BLOCK_MS: "1000"
    GITLAB_API: http://gitlab:80/api/v4
    GITLAB_USERNAME: lishu2016
    GITLAB_SSH_PORT: "22"
    # LLM_API_BASE_URL / LLM_MODEL intentionally NOT set here — both are
    # image-baked in settings/worker_local_k8s.env (and the per-env
    # siblings worker_gitlab_saas.env / worker_local_multi_process.env).
    # Keeping them out of this ConfigMap lets the llmGateway.enabled=true
    # path (configmap.yaml seeds LLM_API_BASE_URL=http://llm-gateway:9000/v1)
    # actually take effect — ConfigMap → process env wins over .env file.

# ── RBAC (1a.3) ───────────────────────────────────────────────────
rbac:
  create: true
serviceAccount:
  create: true
  name: orchestrator

# ── Redis ─────────────────────────────────────────────────────────
redis:
  image: redis:7-alpine
  replicas: 1
  pvcSize: 1Gi
  # Pod placement. EMPTY BY DEFAULT → the template renders no `nodeSelector`
  # key at all, so single-node kind is byte-identical to before. Multi-node
  # (k3s) overlays pin this; see docs/k3s.md and values-k3s-ls4900.yaml.
  nodeSelector: {}
  # storageClassName: ""   # empty → kind default StorageClass `standard`
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Gateway ───────────────────────────────────────────────────────
gateway:
  image:
    repository: dh-gateway
    # latest because images are kind-loaded. NOTES §9 follow-up: switch to a
    # git short-SHA tag to defeat the rolling-update cache trap — wire that by
    # overriding gateway.image.tag / orchestrator.image.tag at deploy time.
    tag: latest
  replicas: 1
  service:
    port: 8000
    # ClusterIP keeps the kind path unchanged (webhook enters via
    # ingress-nginx + the cluster's extraPortMappings). k3s has neither, so
    # its overlay sets NodePort + a fixed port. Empty nodePort → the field is
    # not rendered → ClusterIP Services stay byte-identical.
    type: ClusterIP
    nodePort: ""
  # Pod placement. EMPTY BY DEFAULT → the template renders no `nodeSelector`
  # key at all, so single-node kind is byte-identical to before. Multi-node
  # (k3s) overlays pin this; see docs/k3s.md and values-k3s-ls4900.yaml.
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── NetworkPolicy (1a.6) ──────────────────────────────────────────
# Ingress-only lockdown SCOPED to the first-party core app pods
# (gateway/orchestrator/redis/bf-worker) + explicit allows for the gateway
# port, redis-from-app, and (when monitoring on) the orchestrator metrics
# scrape. The deny policy is deliberately NOT namespace-wide — that
# blackholed the observability stack + worker→llm-gateway (see
# templates/networkpolicy.yaml header, incident 2026-05-31). Egress is left
# open on purpose (NOTES §6e).
networkPolicy:
  enabled: true

# ── Observability (1a.6) ──────────────────────────────────────────
observability:
  # Stamp prometheus.io/scrape annotations on the gateway pod. Does NOT
  # install Prometheus — only wires the scrape contract.
  prometheusAnnotations: true
  # No real /metrics yet → scrape /healthz as an up/down signal.
  scrapePath: /healthz

# ── Ingress (1a.6) ────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: ""            # empty → no-host rule (any Host header)
  annotations: {}

# ── eval-on-k8s Indexed Job (1a.6) ────────────────────────────────
# OFF by default — needs an image that bundles evaluation/ (the bf-worker
# image does not). Template/render-only until that image exists.
eval:
  enabled: false
  image:
    repository: dh-bf-worker   # placeholder; replace with an eval-capable image
    tag: latest
  completions: 4
  parallelism: 2
  ttlSecondsAfterFinished: 600
  args: ["-m", "evaluation.cli", "run"]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ── cloudflared (webhook ingress when there's no public IP) ───────
# OFF by default — only the gitlab.com-via-no-public-IP path needs it
# (overlay: values-gitlab-saas.yaml). LocalGitlab path is unaffected.
cloudflared:
  enabled: false
  image: cloudflare/cloudflared:latest
  # Empty list → default `tunnel --no-autoupdate --url http://gateway:<port>`
  # (free quick tunnel). Override for a named tunnel:
  #   args: ["tunnel", "run", "my-named-tunnel"]
  args: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Orchestrator ──────────────────────────────────────────────────
orchestrator:
  image:
    repository: dh-orchestrator
    tag: latest
  replicas: 1
  pvcSize: 5Gi
  # Pod placement. EMPTY BY DEFAULT → the template renders no `nodeSelector`
  # key at all, so single-node kind is byte-identical to before. Multi-node
  # (k3s) overlays pin this; see docs/k3s.md and values-k3s-ls4900.yaml.
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── LLM gateway (optional, opt-in) ───────────────────────────────────────────
# Per-cluster persistent response cache + multi-backend inference policy.
# OFF by default — the worker talks directly to the LLM API. When ON, the
# worker is auto-routed through this gateway (configmap.yaml seeds the
# worker-config ConfigMap with LLM_VIA_GATEWAY=true + LLM_API_BASE_URL
# pointing at this service; explicit values under configMaps.worker still
# win). Single replica because the cache is a sqlite file; do not scale
# horizontally without rethinking cache coherency.
#
# AWS ECS deployment is unaffected — ECS uses its own CloudFormation stack
# (stack-llm-gateway.yml as an overlay there) and does not consume this
# Helm chart.
llmGateway:
  enabled: false
  image:
    repository: dh-llm-gateway
    tag: latest
  replicas: 1
  service:
    port: 9000
  # Cache db lives on this PVC; gateway is single-replica so RWO is fine.
  pvcSize: 2Gi
  # Pod placement. EMPTY BY DEFAULT → the template renders no `nodeSelector`
  # key at all, so single-node kind is byte-identical to before. Multi-node
  # (k3s) overlays pin this; see docs/k3s.md and values-k3s-ls4900.yaml.
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Verbatim YAML config the gateway loads at startup. Rendered into the
  # llm-gateway-config ConfigMap. Default mirrors
  # configs/llm_gateway/qwen3_api_cached.yaml (Qwen3 Dashscope + persistent
  # configs/llm_gateway/qwen3_api_cached.yaml (Qwen3 Dashscope + persistent
  # cache, normalize_content on so per-run timestamps in CI traces don't
  # drift the key). Override per-deployment via values overlay.
  config:
    backends:
      - name: qwen3_dashscope
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen3-coder-480b-a35b-instruct
        # The chart wires LLM_API_KEY from the sdlcma-secrets Secret into the
        # gateway pod's env; this field tells the gateway which env name to
        # read for the backend. Match what's in the Secret.
        api_key_env: LLM_API_KEY
        request_timeout: 60
    inference_policy:
      type: ordered
      order: [qwen3_dashscope]
    cache:
      mode: cache                      # disabled | record | replay | cache
      db_path: /var/lib/sdlcma/llm_cache.db
      replay_with_latency: true
      log_every_n: 100
      normalize_content: true

# ── Journal volume (optional) ────────────────────────────────────────────────
# When enabled, every spawned bf-worker Job gets a hostPath Volume mounted at
# `path` (RW) and BF_JOURNAL_DIR set to the same path, so the run journal
# (one record.json per bug) survives Pod termination. The runrecord exporter
# (below) reads the same path RO to render Prometheus metrics.
#
# CAVEAT: hostPath works because a single-node kind cluster co-schedules
# workers + exporter on the same node. Multi-node clusters need RWX (NFS /
# CSI) instead — the chart doesn't support that yet; flip this off and
# carry runrecord metrics via a different aggregator there.
#
# AWS ECS is unaffected — ECS workers don't use this chart; their journal
# is per-task ephemeral (we don't run runrecord-exporter on ECS by design,
# since ECS keeps to the minimal capacity envelope).
journal:
  persistence:
    enabled: false
    # Node-local path. DirectoryOrCreate auto-makes it; setup.sh doesn't
    # need to pre-mkdir on the host.
    hostPath: /var/sdlcma/journal

# ── RunRecord exporter (optional, opt-in) ────────────────────────────────────
# Long-running HTTP server (tools/runrecord_exporter.py) that scans the
# journal directory on every Prometheus scrape and renders the same metric
# families that tools/runrecord_to_metrics.py would have written via the
# textfile collector on bare hosts. K8s-shaped: Deployment + Service +
# ServiceMonitor (when monitoring.enabled), no CronJob, no sidecar.
#
# Requires journal.persistence.enabled so the exporter pod can read what
# worker pods wrote.
runrecordExporter:
  enabled: false
  # Reuses the bf-worker image — tools/ is shipped with it and stdlib only
  # is needed, so no separate Dockerfile. Override if you ship a slimmer
  # exporter image.
  image:
    repository: dh-bf-worker
    tag: latest
  replicas: 1
  service:
    port: 9103
  # Pod placement. EMPTY BY DEFAULT → the template renders no `nodeSelector`
  # key at all, so single-node kind is byte-identical to before. Multi-node
  # (k3s) overlays pin this; see docs/k3s.md and values-k3s-ls4900.yaml.
  nodeSelector: {}
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Monitoring (kube-prometheus-stack dependency, opt-in) ────────────────────
# When enabled, this chart pulls in kube-prometheus-stack as a Helm
# dependency: Prometheus Operator + Prometheus + Grafana + Alertmanager +
# node-exporter + kube-state-metrics. The chart's own templates render
# ServiceMonitors targeting gateway / orchestrator / llm-gateway /
# runrecord-exporter and ship the SDLCMA dashboard as a labeled ConfigMap
# (Grafana sidecar auto-discovers it).
#
# IMPORTANT: Run `helm dep update infra/helm/sdlcma` BEFORE the first
# `helm install` to pull the dependency into charts/. setup.sh does this
# automatically.
#
# Values for the kube-prometheus-stack sub-chart MUST live at the top
# level of this file (under the key matching the dependency name) — Helm
# does NOT pass nested values through to sub-charts. See the
# `kube-prometheus-stack:` block at the bottom of this file.
monitoring:
  enabled: false
  scrapeInterval: 15s
  runrecordScrapeInterval: 30s
  # The orchestrator's prometheus_client server port. Must match
  # METRICS_PORT in the orchestrator pod (default 9102 — see
  # orchestrator/orchestrator.py).
  orchestratorMetricsPort: 9102

# ── kube-prometheus-stack passthrough values ─────────────────────────────────
# Top-level key matches the dependency name in Chart.yaml. Sized for
# ls4900 (single-node kind, "production rehearsal"): Alertmanager off,
# retention=2d, modest CPU/memory. Override for real-prod clusters.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # Watch ServiceMonitors in EVERY namespace and ignore the default
      # "release: <name>" label filter — without these, the Operator's
      # Prometheus would skip our SDLCMA ServiceMonitors (which don't
      # carry the release label).
      #
      # GOTCHA (incident 2026-05-31, all Grafana panels empty): the empty
      # `{}` selectors below are necessary but NOT sufficient. kube-
      # prometheus-stack treats an empty serviceMonitorSelector as "unset"
      # (Go-template falsy) and, while *SelectorNilUsesHelmValues is true
      # (its DEFAULT), injects `matchLabels: {release: <name>}` ANYWAY — so
      # our ServiceMonitors were silently never scraped (TSDB had zero
      # sdlcma_* series). The NilUsesHelmValues=false flags are what actually
      # make `{}` mean "match every Monitor". Keep both halves.
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      # 2-day retention — bounded by the kind cluster's local-path
      # volume (couple GB available, not enough for default 10d).
      retention: 2d
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  # Alertmanager off — ls4900 is a rehearsal, not on-call. Re-enable
  # alongside PrometheusRule CRDs when you actually want pages.
  alertmanager:
    enabled: false
  grafana:
    adminPassword: admin   # CHANGE in production — values.local.yaml
    # Sidecar auto-loads ConfigMaps labelled `grafana_dashboard: "1"`
    # — the SDLCMA dashboard CM in this chart carries that label.
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        # Grafana's Prometheus datasource `timeInterval` = the query step
        # FLOOR. kube-prometheus-stack defaults it to the global scrape
        # interval (30s), which capped every panel at 30s resolution even
        # though our ServiceMonitors scrape at monitoring.scrapeInterval=15s.
        # Pin it to 15s so panels render at the resolution we actually
        # collect — purely a query-step change, NOT an extra scrape (no
        # added Prometheus load; 30s-scraped metrics just repeat last value).
        defaultDatasourceScrapeInterval: 15s
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # node-exporter / kube-state-metrics: fine on (small footprint, free
  # cluster-level CPU/mem/pod-state panels).
  prometheus-node-exporter:
    prometheus:
      monitor:
        # Scrape node-exporter at 15s (the stack default is the global 30s)
        # so short CPU/mem spikes fall between fewer samples. Caveat: a spike
        # briefer than the interval is still under-sampled — sampled
        # monitoring can't reproduce `top`'s instantaneous peaks; the
        # System-resources panels use rate(...[1m]) to surface what it can.
        # (No `instance`→node-name relabel: the System-resources panels
        # aggregate across instances into a single line — single shared WSL2
        # host on kind — so the per-node label isn't shown.)
        interval: 15s

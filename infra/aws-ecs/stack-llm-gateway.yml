AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SDLCMA -- ECS stack, llm_gateway variant. Adds llm-gateway (FastAPI
  proxy on localhost:9000) as a 5th container in the services task; the
  bf-worker task uses LLM_API_BASE_URL=http://localhost:9000/v1 +
  LLM_VIA_GATEWAY=true. Same cluster/service names as stack.yml so
  downstream tooling is unchanged; ECR repos use DeletionPolicy: Retain
  so switching stacks does not lose pushed images. See header comment
  block below for design / coexistence rules.

# Design notes (long-form — kept out of Description to satisfy CFN's
# 1024-char limit on that field):
#
# - Same single-EC2 / host-network shape as stack.yml. 5 services
#   containers (redis, gateway, llm-gateway, orchestrator, cloudflared)
#   share the EC2 host's network namespace; bf-worker (host mode, spawned
#   per bug) reaches localhost:9000 on the same EC2.
# - Cluster name `sdlcma-cluster`, service name `sdlcma-services`,
#   bf-worker task family `bf-worker` — all identical to stack.yml so
#   regression.sh / gitlab-smoke.sh / CloudWatch dashboards work
#   unchanged.
# - ECR repos here share names with stack.yml (`dh-gateway`,
#   `dh-orchestrator`, `dh-bf-worker`) and add `dh-llm-gateway`. With
#   DeletionPolicy: Retain, switching stacks (delete one, create the
#   other) does not destroy pushed images.
# - All other contracts (gitlab.com auth via gitlab_saas env,
#   WORKER_SPAWNER=ecs, host-network worker, outbound-only SG) are
#   identical to stack.yml.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID (default VPC is fine)
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Public subnet for the EC2 instance + ECS services. Worker task runs
      in host network mode so this is the only subnet needed.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access (create in Console > EC2 > Key Pairs)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
  SwapSizeGB:
    Type: Number
    Default: 4
    Description: Swap file size in GB (mandatory on 1 GB t3.micro)
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id
    Description: ECS-optimized AMI (auto-resolved via SSM)
  ServiceDesiredCount:
    Type: Number
    Default: 0
    Description: Desired task count (0 = pause; set to 1 after images are pushed to ECR)
  GitlabToken:
    Type: String
    NoEcho: true
    Description: "gitlab.com project/group access token (scopes: api + write_repository)"
  LLMApiKey:
    Type: String
    NoEcho: true
    Description: >
      LLM API key. Injected as the gateway's DASHSCOPE_API_KEY for the
      qwen3_dashscope backend in qwen3_api.yaml. Also passed to
      bf-worker as LLM_API_KEY but the gateway ignores the worker's
      Authorization header and uses this key for upstream calls.
  LLMApiBaseUrl:
    Type: String
    Default: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    Description: >
      Upstream LLM API base URL — used INSIDE the gateway config (via the
      bundled qwen3_api.yaml's `base_url`), not by the worker directly.
      Worker hits the gateway at http://localhost:9000/v1 regardless of
      this value. Kept here for symmetry with `stack.yml` and so the
      gateway can read the canonical upstream URL via env if a future
      config templates it in.
  LLMModel:
    Type: String
    Default: qwen3-coder-plus
    Description: >
      LLM model name. Used inside the gateway config; the gateway
      rewrites the worker's `model` field to whichever backend it
      selects, so the worker's LLM_MODEL is informational.
  LlmGatewayConfigPath:
    Type: String
    Default: /app/configs/llm_gateway/qwen3_api.yaml
    Description: >
      Path INSIDE the llm-gateway container to the YAML config file.
      Defaults to the bundled single-backend qwen3 config. Swap to
      qwen3_plus_local.yaml / qwen3_and_ds4.yaml etc. if you want a
      multi-backend policy (those configs reference additional
      api_key_env names you would need to wire in as extra environment
      vars below).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcId, PublicSubnetA]
      - Label: {default: Compute}
        Parameters: [KeyName, InstanceType, SwapSizeGB]
      - Label: {default: Secrets}
        Parameters: [GitlabToken, LLMApiKey, LLMApiBaseUrl, LLMModel]
      - Label: {default: LLM Gateway}
        Parameters: [LlmGatewayConfigPath]

Resources:
  # ── ECR Repositories ──────────────────────────────────────────
  # DeletionPolicy: Retain so switching between stack.yml and this stack
  # does not destroy pushed images. The trade-off is that `delete-stack`
  # leaves the repos behind; clean them up manually if you really want
  # them gone (`aws ecr delete-repository --force ...`).
  EcrGateway:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dh-gateway
      ImageTagMutability: MUTABLE

  EcrOrchestrator:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dh-orchestrator
      ImageTagMutability: MUTABLE

  EcrBfWorker:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dh-bf-worker
      ImageTagMutability: MUTABLE

  EcrLlmGateway:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dh-llm-gateway
      ImageTagMutability: MUTABLE

  # ── IAM Roles ─────────────────────────────────────────────────
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EcsInstanceRole]

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  OrchestratorTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunBfWorkerTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # RunTask operates on the task-definition ARN — what you launch.
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bf-worker:*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bf-worker"
              # DescribeTasks / StopTask operate on the task INSTANCE ARN —
              # what's actually running in the cluster. Mismatching this
              # resource onto task-definition ARNs (the original bug here)
              # made every Monitor poll AccessDenied; the worker still
              # completed via the heartbeat-key fallback, but the log
              # was noisy and Monitor lost mid-run task visibility.
              - Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/sdlcma-cluster/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EcsTaskExecutionRole.Arn

  # ── Security Group (the single one used by everything) ────────
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SDLCMA host network -- outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"

  # ── EC2 Instance (ECS container instance) ──────────────────────
  EcsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref EcsAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref EcsInstanceProfile
      SecurityGroupIds: [!Ref ServiceSecurityGroup]
      SubnetId: !Ref PublicSubnetA
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          echo "ECS_CLUSTER=sdlcma-cluster" >> /etc/ecs/ecs.config
          # Swap (mandatory OOM mitigation on 1 GB t3.micro). With the
          # llm-gateway container added, peak host RAM use can brush 1 GB
          # (services reservations ~576 MB + bf-worker peak ~450 MB);
          # 4 GB swap keeps pip-install + pytest spikes from OOM-killing.
          if ! swapon --show=NAME --noheadings | grep -q /swapfile; then
            fallocate -l ${SwapSizeGB}G /swapfile 2>/dev/null || \
              dd if=/dev/zero of=/swapfile bs=1M count=$((${SwapSizeGB}*1024)) status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
          fi
      Tags:
        - Key: Name
          Value: sdlcma-ecs-host

  # ── ECS Cluster ────────────────────────────────────────────────
  # Same name as stack.yml on purpose — downstream tooling (regression.sh,
  # CloudWatch dashboards) keys off this name.
  SdlcmaCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: sdlcma-cluster

  # ── CloudWatch Log Groups ──────────────────────────────────────
  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sdlcma/services
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sdlcma/worker
      RetentionInDays: 7

  # ── ECS Task Definitions ────────────────────────────────────────
  ServicesTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sdlcma-services
      # host mode: 5 containers share the EC2 host's network namespace, so
      # `localhost:6379` (redis) / `localhost:8000` (webhook gateway) /
      # `localhost:9000` (llm-gateway) resolve across containers AND from
      # the host-network bf-worker spawned on the same EC2.
      NetworkMode: host
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt OrchestratorTaskRole.Arn
      ContainerDefinitions:
        # Memory accounting on t3.micro (~940 MB usable):
        #   redis ............  64
        #   gateway ..........  96
        #   llm-gateway ......  32   (NEW — soft reservation; actual
        #                             RSS ~50-70 MB for Python+uvicorn+
        #                             fastapi+httpx + small policy state.
        #                             ECS uses MemoryReservation for
        #                             scheduling, not the runtime ceiling,
        #                             so this just leaves headroom for
        #                             bf-worker's 512 MB hard request to
        #                             schedule. Initially set to 96 but
        #                             observed RESOURCE:MEMORY rejecting
        #                             RunTask: 480 reserved → 460 avail
        #                             vs 512 needed.)
        #   orchestrator ..... 192
        #   cloudflared ......  32
        #   --------------------
        #   total ............ 416 MB reservations
        # bf-worker scheduling check: 940 - 416 = 524 ≥ 512 ✓
        # Runtime: bf-worker hard cap 512 MB runs concurrently in the
        # same host network namespace → peak ~ 928 MB plus 4 GB swap.
        # If you observe sustained swap pressure during pip-install
        # peaks, bump InstanceType to t3.small.
        - Name: redis
          Image: redis:7-alpine
          MemoryReservation: 64
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: redis

        - Name: gateway
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-gateway:latest"
          MemoryReservation: 96
          Essential: true
          DependsOn:
            - ContainerName: redis
              Condition: START
          Environment:
            - Name: ENV
              Value: gitlab_saas
            - Name: REDIS_URL
              Value: redis://localhost:6379/0
            - Name: LLM_API_KEY
              Value: !Ref LLMApiKey
            # webhook gateway does not call the LLM itself; these env vars
            # are kept so the gateway image's settings probe is happy.
            - Name: LLM_API_BASE_URL
              Value: !Ref LLMApiBaseUrl
            - Name: LLM_MODEL
              Value: !Ref LLMModel
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

        - Name: llm-gateway
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-llm-gateway:latest"
          MemoryReservation: 32
          Essential: true
          # No DependsOn — llm-gateway is self-contained (FastAPI + httpx),
          # only outbound HTTPS to upstream backends. Starting it before
          # orchestrator means worker's first LLM call always lands on a
          # ready listener.
          Environment:
            - Name: LLM_GATEWAY_CONFIG
              Value: !Ref LlmGatewayConfigPath
            # qwen3_api.yaml references api_key_env: DASHSCOPE_API_KEY.
            # Reuse the existing LLMApiKey parameter (single source of
            # truth) — operationally simpler than introducing a separate
            # DashscopeApiKey parameter.
            - Name: DASHSCOPE_API_KEY
              Value: !Ref LLMApiKey
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: llm-gateway

        - Name: orchestrator
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-orchestrator:latest"
          MemoryReservation: 192
          Essential: true
          DependsOn:
            - ContainerName: redis
              Condition: START
          Environment:
            - Name: ENV
              Value: gitlab_saas
            - Name: WORKER_SPAWNER
              Value: ecs
            - Name: REDIS_URL
              Value: redis://localhost:6379/0
            - Name: GITLAB_API
              Value: https://gitlab.com/api/v4
            - Name: GITLAB_USERNAME
              Value: oauth2
            - Name: GITLAB_PRIVATE_TOKEN
              Value: !Ref GitlabToken
            - Name: ECS_CLUSTER_NAME
              Value: sdlcma-cluster
            - Name: ECS_WORKER_TASK_DEF
              Value: bf-worker
            - Name: ECS_WORKER_SUBNETS
              Value: !Ref PublicSubnetA
            - Name: ECS_WORKER_SECURITY_GROUPS
              Value: !Ref ServiceSecurityGroup
            - Name: ECS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ECS_WORKER_NETWORK_MODE
              Value: host
            # Orchestrator itself doesn't call the LLM; these env vars
            # carry through to the spawned worker via the spawner's
            # fallback (worker overrides come first, then orchestrator's
            # env). For the gateway path the AUTHORITATIVE worker LLM
            # config is set on BfWorkerTaskDef below — both sides point
            # at the in-host gateway URL so there is no drift if the
            # fallback ever activates.
            - Name: LLM_API_KEY
              Value: !Ref LLMApiKey
            - Name: LLM_API_BASE_URL
              Value: http://localhost:9000/v1
            - Name: LLM_MODEL
              Value: !Ref LLMModel
            - Name: LLM_VIA_GATEWAY
              Value: "true"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orchestrator

        - Name: cloudflared
          Image: cloudflare/cloudflared:latest
          MemoryReservation: 32
          Essential: true
          DependsOn:
            - ContainerName: gateway
              Condition: START
          Command:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:8000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cloudflared

  BfWorkerTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bf-worker
      NetworkMode: host
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: bf-worker
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-bf-worker:latest"
          Essential: true
          Memory: 512
          Environment:
            - Name: GITLAB_API
              Value: https://gitlab.com/api/v4
            - Name: GITLAB_USERNAME
              Value: oauth2
            - Name: GITLAB_PRIVATE_TOKEN
              Value: !Ref GitlabToken
            # ── LLM via gateway ─────────────────────────────────────
            # Worker hits the llm-gateway sidecar over localhost (host
            # network mode → worker and llm-gateway share the EC2 host's
            # network namespace). LLM_VIA_GATEWAY=true makes the worker
            # attach X-Sdlcma-Bug-Id / X-Sdlcma-Attempt headers and skip
            # the self-hosted /v1/models name probe (the gateway exposes
            # the UNION of backend models on /v1/models, not a single
            # name to compare against).
            - Name: LLM_API_KEY
              Value: !Ref LLMApiKey
            - Name: LLM_API_BASE_URL
              Value: http://localhost:9000/v1
            - Name: LLM_MODEL
              Value: !Ref LLMModel
            - Name: LLM_VIA_GATEWAY
              Value: "true"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bf-worker

  # ── ECS Service ────────────────────────────────────────────────
  SdlcmaService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref SdlcmaCluster
      ServiceName: sdlcma-services
      TaskDefinition: !Ref ServicesTaskDef
      DesiredCount: !Ref ServiceDesiredCount
      LaunchType: EC2
      SchedulingStrategy: REPLICA
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
    DependsOn:
      - EcsInstance

Outputs:
  EcrGatewayUri:
    Description: ECR URI for dh-gateway
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-gateway:latest"
  EcrOrchestratorUri:
    Description: ECR URI for dh-orchestrator
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-orchestrator:latest"
  EcrBfWorkerUri:
    Description: ECR URI for dh-bf-worker
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-bf-worker:latest"
  EcrLlmGatewayUri:
    Description: ECR URI for dh-llm-gateway
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dh-llm-gateway:latest"
  ClusterName:
    Description: ECS Cluster name (same as stack.yml)
    Value: !Ref SdlcmaCluster
  InstancePublicIp:
    Description: EC2 instance public IP (SSH here)
    Value: !GetAtt EcsInstance.PublicIp
  CloudflaredLogHint:
    Description: Command to read the cloudflared tunnel URL
    Value: !Sub "aws logs tail /sdlcma/services --filter trycloudflare --region ${AWS::Region}"
  LlmGatewayHealthHint:
    Description: From the EC2 host, verify the gateway came up
    Value: "curl -s http://localhost:9000/health | python3 -m json.tool"
  WebhookSetup:
    Description: After finding the cloudflared URL, set it on gitlab.com (Pipeline events, SSL verification ON)
    Value: "https://<trycloudflare-url>/webhook"

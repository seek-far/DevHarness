# Stage 1a.2: Gateway with externalized config and HTTP healthz probe.
#
# Changes from 1a.1:
#   - Hardcoded `env:` block removed; envFrom: configMapRef: gateway-config.
#   - TCP probe → httpGet /healthz (added to gateway.py in 1a.2).
#   - imagePullPolicy stays IfNotPresent (image is loaded via `kind load`).
#
# Apply order (first time):
#   kubectl apply -f infra/kind/manifests/configmap.yaml
#   kubectl apply -f infra/kind/manifests/gateway.yaml
#
# Rolling a config change (no image rebuild needed):
#   kubectl apply -f infra/kind/manifests/configmap.yaml
#   kubectl rollout restart deployment/gateway -n sdlcma
#
# Smoke:
#   kubectl port-forward svc/gateway 8000:8000 -n sdlcma
#   curl http://localhost:8000/healthz                              # → {"status":"ok"}
#   curl -X POST http://localhost:8000/webhook \
#        -H 'Content-Type: application/json' -d '{"k":"v"}'

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sdlcma
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: dh-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sdlcma
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http

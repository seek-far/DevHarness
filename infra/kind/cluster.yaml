# kind cluster for SDLCMA local development (Stage 1a).
#
# Cluster name → kubeconfig context: kind-sdlcma-dev
# Bring up:   kind create cluster --config infra/kind/cluster.yaml
# Tear down:  kind delete cluster --name sdlcma-dev
#
# Layout:
#   - 1 control-plane (labeled ingress-ready=true for future ingress-nginx)
#   - 1 worker
#
# extraPortMappings expose 80/443 from the control-plane node to the WSL2 host
# as 18080/18443. NOT 8080/8443: the local dev GitLab binds host :8080
# (see settings/worker_local_multi_process.env GITLAB_API=localhost:8080),
# so kind grabbing 8080 would race GitLab for the port. 18080/18443 are
# non-privileged and clear of it. These are still placeholders for the
# ingress controller in 1a.4+; through 1a.3 the Gateway is reached via
# `kubectl port-forward` and these mappings carry no traffic yet.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sdlcma-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
  - role: worker

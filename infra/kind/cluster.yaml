# kind cluster for SDLCMA local development (Stage 1a).
#
# Cluster name → kubeconfig context: kind-sdlcma-dev
# Bring up:   kind create cluster --config infra/kind/cluster.yaml
# Tear down:  kind delete cluster --name sdlcma-dev
#
# Layout:
#   - 1 control-plane (labeled ingress-ready=true for future ingress-nginx)
#   - 1 worker
#
# extraPortMappings expose 80/443 from the control-plane node to the WSL2 host
# as 8080/8443 (non-privileged, avoids conflicts with anything Windows might
# bind on :80). These are placeholders for the ingress controller in 1a.4+;
# Stage 1a.1 still reaches the Gateway via `kubectl port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sdlcma-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker

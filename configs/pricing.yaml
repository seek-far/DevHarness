# Model → price, for DIRECT-to-backend runs (no llm_gateway).
#
# In gateway mode this file is unused: the gateway returns the authoritative
# cost in `X-Sdlcma-Cost-Usd`, because only it knows which backend the policy
# picked and what that backend charges. Prices there live on the backend in the
# gateway YAML, which is the right home — the same model costs different amounts
# depending on where it is served.
#
# Keys are `LLM_MODEL` values. A model that is absent from this table yields a
# cost of None, never a guess: a wrong number in a cost dashboard is worse than
# a blank one, because a blank prompts you to go look and a wrong number gets
# quoted.
#
# Units: USD per 1M tokens. Confirm against your provider's portal — Azure
# prices vary by region and deployment type.

models:
  # ── Azure OpenAI (verify per region/SKU in the portal) ──
  gpt-5-mini:
    input_per_1m: 0.25
    output_per_1m: 2.00
    cached_input_per_1m: 0.025
    currency: USD
  gpt-5.4-mini:
    input_per_1m: 0.75
    output_per_1m: 4.50
    cached_input_per_1m: 0.07
    currency: USD

  # ── Alibaba Dashscope ──
  # qwen3-coder-480b-a35b-instruct: intentionally ABSENT until someone fills in
  # the real Dashscope rates. Do NOT add it at 0.0/0.0 as a placeholder: an entry
  # with zero prices does not mean "unpriced", it means "we priced this and it
  # was free" — the run would report total_cost_usd: 0.0 with
  # cost_source: "local_pricing", which is a confident lie. Absent → None →
  # "we don't know", which is the truth. (This file said exactly that two lines
  # down, and the placeholder violated it anyway. Caught 2026-07-14.)
  #
  # Self-hosted models are absent for the same reason: their marginal token cost
  # really is zero, but listing them at 0.00 would be indistinguishable from a
  # backend nobody has priced yet.
